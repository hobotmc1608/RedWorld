name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=${JAVA_HOME}"
          if [ -z "${JAVA_HOME}" ]; then
            echo "Error: JAVA_HOME is not set." >&2
            exit 1
          fi
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '[\"_.]' '/version/ {if ($2 == "1") print $3; else print $2}')
          echo "Detected Java major version: ${JAVA_MAJOR}"
          if [ -z "${JAVA_MAJOR}" ] || [ "${JAVA_MAJOR}" -lt 17 ]; then
            echo "Error: Active Java major version (${JAVA_MAJOR:-unknown}) is lower than 17." >&2
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            "${JAVA_HOME}/bin/keytool" -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: ./debug.keystore could not be created." >&2
            exit 1
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify Debug APK output
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "${TARGET_APK}" ]; then
            echo "Verified debug APK exists at: ${TARGET_APK}"
          else
            echo "Error: Expected debug APK not found at ${TARGET_APK}." >&2
            echo "Searching inside app/build/outputs/apk for discovered APK paths:" >&2
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk" -print >&2
            else
              echo "Directory app/build/outputs/apk does not exist." >&2
            fi
            exit 1
          fi

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
